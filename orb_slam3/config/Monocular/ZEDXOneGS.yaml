%YAML:1.0

# Corrisponde a immagini 960x600 (Python driver resize da 1920x1200)
Camera.type: "PinHole"

Camera.fx: 367.425
Camera.fy: 367.248
Camera.cx: 485.147
Camera.cy: 292.160

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.width: 960
Camera.height: 600
Camera.fps: 15
Camera.RGB: 0

# Disabilita loop closing: causa problemi durante IMU init su mono
loopClosing: 0

Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999974,  0.004053,  0.006023, -0.0061,
         -0.004042,  0.999990, -0.001750, -0.00708,
         -0.006030,  0.001725,  0.999980, -0.00196,
          0,          0,          0,        1      ]

IMU.Frequency: 200
IMU.NoiseGyro: 0.00017
IMU.NoiseAcc:  0.00186
IMU.GyroWalk:  0.0000022
IMU.AccWalk:   0.000043

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 7
ORBextractor.minThFAST: 3

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
